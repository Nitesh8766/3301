<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLACK — Stage 3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #030303;
    --border: rgba(255,255,255,.09);
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: var(--bg);
    overflow: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 32px;
}

/* BLACK theme background */
.background {
    position: fixed;
    inset: 0;
    z-index: -5;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.055),
            transparent 28%
        ),
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.018),
            transparent 25%
        ),
        #030303;

    animation: ambient 12s ease-in-out infinite alternate;
}

@keyframes ambient {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }
}

/* Moving grid */
.grid {
    position: fixed;
    inset: -100px;
    z-index: -4;

    opacity: .12;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 10%,
            transparent 75%
        );

    animation: gridMove 25s linear infinite;
}

@keyframes gridMove {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(55px,55px);
    }
}

/* Subtle noise */
.noise {
    position: fixed;
    inset: 0;

    z-index: 20;
    pointer-events: none;

    opacity: .025;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

    animation: noiseMove .25s steps(2) infinite;
}

@keyframes noiseMove {
    0%,100% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(2px,-1px);
    }

    50% {
        transform: translate(-1px,2px);
    }

    75% {
        transform: translate(1px,1px);
    }
}

/* Stage image */
.stage {
    width: min(1500px, 100%);

    display: flex;
    align-items: center;
    justify-content: center;
}

.stage img {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: calc(100vh - 64px);

    object-fit: contain;

    border: 1px solid var(--border);

    box-shadow:
        0 0 50px rgba(0,0,0,.75);
}

/* Phone */
@media (max-width: 700px) {

    body {
        padding: 12px;
    }

    .stage img {
        max-height: calc(100vh - 24px);
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="grid"></div>
<div class="noise"></div>

<main class="stage">

    <!-- Original PNG. No filter or modification. -->
    <img
        src="Round2-stage3-final.png"
        alt="Stage 3"
    >

</main>

</body>
</html>
